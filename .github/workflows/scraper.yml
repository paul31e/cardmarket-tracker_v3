name: TCG Price Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
          LOG_HTML: false
          CAPTCHA_SOLVER: none

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Wait for FlareSolverr
        run: |
          echo "Warte auf FlareSolverr..."
          until curl -s http://localhost:8191/ > /dev/null; do
            sleep 2
          done
          echo "FlareSolverr ist bereit!"

      - name: Run Scraper
        env:
          CM_USERNAME: ${{ secrets.CM_USERNAME }}
          CM_PASSWORD: ${{ secrets.CM_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python scraper.py

      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.csv
          git diff --staged --quiet || (git commit -m "Update price data [skip ci]" && git push)
